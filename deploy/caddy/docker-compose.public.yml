services:
  frontend:
    build:
      args:
        # Empty in production so the browser uses the same origin served by Caddy.
        VITE_API_BASE_URL: ""

  caddy:
    image: caddy:2.8
    container_name: connecthub-caddy
    restart: unless-stopped
    depends_on:
      - frontend
      - gateway-service
    ports:
      - "80:80"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
